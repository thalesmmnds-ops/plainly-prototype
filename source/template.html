<title>Plainly Prototype</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2333473A'/%3E%3Ctext x='29' y='44' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='44' fill='%23F1EADC'%3Ep%3C/text%3E%3Ccircle cx='48' cy='41' r='5' fill='%23B85A38'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Sizing follows docs/ux-review-wireframe-sizing-01.md: 44px targets, 8 type sizes (12 14 16 20 28 36 40 56), 4px spacing scale. */
  :root{
    /* Brand palette from docs/brand/brand-core.md section 8: oat base, forest secondary, clay accent, mustard CTA, verdict colors. */
    --paper:#F1EADC; --raised:#FBF8F2; --w-ink:#2A2420; --w-soft:#6B5F52; --stroke:#C9BCA3; --control:#8C7F6E; --off:#9A8E7E; --fill:#E9DFCB; --fill-2:#DCD0B8;
    --forest:#33473A; --on-forest:#FBF8F2; --on-forest-soft:#E9DFCB;   /* dark anchor: bands, footer, summary. Never under a clay button (2.2:1) */
    --apricot:#F5BC8F; --apricot-100:#FBE3CF;   /* warm light: hero block, Pregnancy era */
    --mustard:#D9A23A;   /* highlights only, never buttons (brand-core 8) */
    --clay:#B85A38; --clay-hover:#9E4B2E; --on-clay:#FFFFFF;   /* terracotta: priority-1 actions and the logo only */
    --sel:#2A2420; --on-sel:#FBF8F2;   /* selected/pressed states: ink, never brand or verdict colors */
    --r-tag:6px; --r-inner:8px; --r-field:10px; --r-surface:12px; --r-dialog:16px; --r-pill:999px;   /* buttons and chips are pills */
    /* verdict colors: tags only, never on buttons, chips or states. Mustard/gold is reserved for Nice-to-have. */
    --necessary:#3F6B4C; --nice:#7A5C18; --nice-bg:#EFE3C2; --skip:#6B5E50;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Public Sans', system-ui, sans-serif;
    --s2:2px; --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s24:24px; --s32:32px; --s20:20px; --s40:40px; --s48:48px; --s64:64px; --s96:96px;   /* spacing scale; sections breathe at 64 (phone) / 96 (desktop), as on wise.com */
    --gutter:16px;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:118px;}
  body{
    margin:0; padding:0; background:var(--paper); color:var(--w-ink); font-family:var(--font-body); font-size:1rem; line-height:1.5rem;
    padding-left:max(0px, env(safe-area-inset-left, 0px)); padding-right:max(0px, env(safe-area-inset-right, 0px));
  }

  /* the prototype frame: one full-width site whose layout responds to its own width via container queries */
  .proto{container-type:inline-size; background:var(--paper); color:var(--w-ink); min-height:100vh; display:flex; flex-direction:column; font-size:1rem; line-height:1.5rem;}
  .proto main{flex:1 0 auto;}
  :where(.proto button, .proto input, .proto select){font:inherit;}
  .proto button:focus-visible, .proto input:focus-visible, .proto select:focus-visible{outline:2px solid var(--w-ink); outline-offset:2px;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .sm{font-size:.875rem; line-height:1.25rem; color:var(--w-soft); margin:0;}
  .cap{font-size:.875rem; line-height:1.25rem; font-weight:600; color:var(--w-ink);}

  /* header: two rows on narrow frames, one row from 640px */
  .hdr, .ftr{--edge:max(var(--gutter), calc((100% - 1120px) / 2 + var(--gutter)));}
  .hdr{position:sticky; top:0; z-index:6; display:flex; flex-wrap:wrap; align-items:center; gap:var(--s4) var(--s8); padding:var(--s8) var(--edge); padding-top:max(var(--s8), env(safe-area-inset-top, 0px)); background:var(--paper); border-bottom:1.5px solid var(--stroke);}
  .logo{order:1; margin-right:auto; display:inline-flex; align-items:center; min-height:44px; padding:0 var(--s8) 0 0; border:0; background:none; color:var(--forest); cursor:pointer; font-family:var(--font-display); font-weight:600; font-size:1.375rem; letter-spacing:-0.01em; line-height:1.5rem;}
  .hdr nav{order:3; flex:1 1 100%; display:flex; gap:var(--s8);}
  .navbtn{display:inline-flex; align-items:center; justify-content:center; flex:1 1 0; min-height:44px; padding:0 var(--s8); border:0; background:none; color:inherit; border-radius:var(--r-inner); font-size:.875rem; line-height:1.25rem; font-weight:500; cursor:pointer;}
  .navbtn[aria-current="page"]{font-weight:700; text-decoration:underline; text-underline-offset:5px;}
  .navcta{flex:1.3 1 0; display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 var(--s16); border:1.5px solid transparent; border-radius:var(--r-pill); background:transparent; color:var(--w-ink); font-size:.875rem; line-height:1.25rem; font-weight:600; cursor:pointer; white-space:nowrap;}
  .navcta[aria-current="page"]{text-decoration:underline; text-underline-offset:4px;}
  .navcta .long{display:none;}
  .authbtn{order:2; display:inline-flex; align-items:center; min-height:44px; padding:0 var(--s16); border:1.5px solid var(--control); border-radius:var(--r-pill); background:none; color:inherit; font-size:.875rem; line-height:1.25rem; font-weight:600; cursor:pointer;}
  .acct-menu{position:absolute; right:var(--edge); top:calc(100% - 2px); z-index:2; background:var(--raised); border:1.5px solid var(--stroke); border-radius:var(--r-field); padding:var(--s12) var(--s16); display:grid; gap:var(--s8); min-width:200px;}

  /* pages */
  .page{max-width:1120px; width:100%; margin-inline:auto; padding:var(--s24) var(--gutter) var(--s48); display:grid; gap:var(--s24);}
  .h1{font-family:var(--font-display); font-weight:600; font-size:1.75rem; line-height:2rem; letter-spacing:-0.01em; margin:0; text-wrap:balance;}
  .h1.display{font-size:2.25rem; line-height:2.5rem;}
  .sec-h, .how-h{font-family:var(--font-display); font-weight:600; font-size:1.25rem; line-height:1.5rem; margin:0;}
  .sub{color:var(--w-soft); margin:var(--s4) 0 0;}
  .field{width:100%; min-height:44px; border:1.5px solid var(--control); border-radius:var(--r-field); background:var(--raised); color:inherit; padding:0 var(--s16); font-size:1rem; line-height:1.5rem;}
  textarea.field{padding:var(--s12) var(--s16); min-height:110px;}
  .field::placeholder{color:var(--w-soft); opacity:1;}
  .chips{display:flex; flex-wrap:wrap; gap:var(--s8);}
  .chip{position:relative; display:inline-flex; align-items:center; min-height:36px; padding:0 var(--s12); border:1.5px solid var(--control); border-radius:var(--r-pill); background:var(--raised); color:inherit; font-size:.875rem; line-height:1.25rem; font-weight:500; cursor:pointer;}
  .chip::before{content:""; position:absolute; inset:-4px 0;}
  .chip[aria-pressed="true"]{background:var(--sel); color:var(--on-sel); border-color:var(--sel);}
  /* baby's-age chips: one brand color per age (oat, terracotta, mustard, forest, warm taupe), tint when off, deep fill + white when on */
  .chip.age{gap:6px; padding:0 var(--s16) 0 var(--s12); border-color:transparent; background:var(--a-tint); color:var(--a-ink); font-weight:600;}
  .chip.age[aria-pressed="true"]{background:var(--a-deep); border-color:var(--a-deep); color:#FFFFFF;}
  .chip.age:not([aria-pressed="true"]):hover{background:var(--a-tint); border-color:var(--a-ink);}
  .age-ico{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .age-all{--a-tint:#E6DED0; --a-ink:#3D352E; --a-deep:#2A2420;}
  .age-nb{--a-tint:#F2DDD3; --a-ink:#8C4128; --a-deep:var(--clay);}
  .age-m03{--a-tint:#F3E6C6; --a-ink:#6B4F12; --a-deep:#8C6B1F;}
  .age-m36{--a-tint:#DCE3DA; --a-ink:#33473A; --a-deep:#33473A;}
  .age-m6{--a-tint:#E5DDD2; --a-ink:#4E443A; --a-deep:#6B5F52;}
  .controls{display:grid; gap:var(--s12);}
  .az{display:flex; flex-wrap:wrap; gap:var(--s4);}
  .az button{border:0; background:none; color:inherit; font-size:.875rem; line-height:1.25rem; font-weight:600; width:36px; height:44px; cursor:pointer; border-radius:var(--r-tag); text-decoration:underline; text-underline-offset:3px;}
  .letter{font-family:var(--font-display); font-size:1.75rem; line-height:2rem; font-weight:400; color:var(--w-ink); padding:var(--s40) 0 var(--s12); border-bottom:1.5px solid var(--stroke); margin:0;}
  .letter:first-child{padding-top:var(--s8);}

  .img{border:1.5px solid var(--stroke); border-radius:var(--r-inner); background-color:var(--fill);
    background-image:
      linear-gradient(to top right, transparent calc(50% - .75px), var(--stroke) calc(50% - .75px), var(--stroke) calc(50% + .75px), transparent calc(50% + .75px)),
      linear-gradient(to bottom right, transparent calc(50% - .75px), var(--stroke) calc(50% - .75px), var(--stroke) calc(50% + .75px), transparent calc(50% + .75px)); display:block;}
  .thumb{width:48px; height:48px; flex:none;}
  .img.big{aspect-ratio:4/3; width:100%;}

  /* verdict tags: three shapes, not just three glyphs. Necessary is filled, Nice-to-have is outlined with a dot, Skip it is a quiet empty circle. */
  /* verdict tags: 24px, 6px corners (labels, not buttons), roomier inside like Airbnb's tags.
     Same circle icon on all three until an icon set is chosen; the word and the color carry the verdict. */
  .v{display:inline-flex; justify-self:start; width:fit-content; align-items:center; gap:6px; min-height:24px; padding:0 var(--s12) 0 10px; border:1.5px solid var(--stroke); border-radius:var(--r-tag); background:var(--raised); color:var(--w-ink); font-size:.75rem; line-height:1rem; font-weight:600; white-space:nowrap;}
  .mk{display:inline-block; width:8px; height:8px; border-radius:50%; background:currentColor; flex:none;}
  /* verdict colors from brand-core: Necessary green, Nice-to-have gold, Skip it muted warm gray (never red) */
  .v-nec{background:var(--necessary); border-color:var(--necessary); color:var(--raised);}
  .v-nice{border-color:var(--nice); background:var(--nice-bg); color:var(--nice);}
  .v-dep{color:var(--skip); border-color:var(--skip);}
  .have-tag{font-size:.75rem; line-height:1rem; font-weight:600; color:var(--w-ink);}

  .item{border-bottom:1px solid var(--fill-2);}
  .item .item-head{padding:var(--s20) 0;}
  .item-head, .card-head{display:flex; align-items:center; gap:var(--s12); width:100%; min-height:44px; background:none; border:0; color:inherit; text-align:left; cursor:pointer; padding:var(--s12) 0;}
  .txt{display:grid; gap:var(--s4); min-width:0; flex:1;}
  .line1{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s4) var(--s8);}
  .name{font-weight:600;}
  .desc{color:var(--w-soft); font-size:.875rem; line-height:1.375rem; font-weight:400; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .is-open .desc{display:block; -webkit-line-clamp:unset;}
  .chev{flex:none; transition:transform .15s; font-size:.875rem;}
  .is-open > h3 .chev, .is-open > .item-h .chev{transform:rotate(180deg);}
  h3.item-h, h3.ch{margin:0; font-size:inherit;}
  .detail{padding:var(--s4) 0 var(--s24); display:grid; gap:var(--s16);}
  .detail[hidden]{display:none;}
  .dtext{display:grid; gap:var(--s12); min-width:0;}
  .dtext p{margin:0; line-height:1.625rem;}
  .lead{font-weight:500;}
  .facts{display:grid; grid-template-columns:1fr 1fr; gap:var(--s8); margin:0;}
  .facts.one{grid-template-columns:1fr;}
  .facts div{background:var(--paper); border:0; border-radius:var(--r-inner); padding:var(--s8) var(--s12); display:grid; gap:var(--s2);}
  .facts dt{font-size:.875rem; line-height:1.25rem; font-weight:600; color:var(--w-ink);}
  .facts dd{margin:0; font-weight:600;}
  .safety{background:var(--paper); display:flex; gap:var(--s8); align-items:flex-start; border:0; border-radius:var(--r-inner); padding:var(--s8) var(--s12);}
  .ico{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; margin-top:var(--s2);}
  .actions{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s8) var(--s12);}
  .btn{display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 var(--s16); border:1.5px solid var(--control); border-radius:var(--r-pill); background:var(--raised); color:inherit; font-size:.875rem; line-height:1.25rem; font-weight:600; cursor:pointer;}
  .btn.primary{background:var(--clay); color:var(--on-clay); border-color:var(--clay);}
  .btn.quiet{border-color:transparent; text-decoration:underline; text-underline-offset:3px;}
  /* priority 2 (as on wise.com): outline only, ink border on a transparent fill; one filled primary per section */
  .btn.secondary, .btn.cta{background:transparent; color:var(--w-ink); border-color:var(--w-ink);}
  .btn.big{min-height:52px; padding:0 var(--s24); border-radius:var(--r-pill); font-size:1rem; line-height:1.5rem;}
  .btn:disabled{border-color:var(--stroke); color:var(--off); cursor:default;}
  .linkbtn{min-height:44px; min-width:88px; margin-inline:calc(var(--s12) * -1); padding:0 var(--s12); border:0; background:none; color:var(--w-soft); font-size:.875rem; line-height:1.25rem; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}

  .sum{background:var(--forest); color:var(--on-forest); border:0; border-radius:var(--r-surface); padding:var(--s20); display:grid; gap:var(--s8);}
  .sum strong{font-size:1.125rem; line-height:1.5rem;}
  .sum .sm{color:var(--on-forest-soft);}
  .ctl-label{display:block; margin-bottom:var(--s8);}
  #ilist{display:grid; gap:var(--s40);}
  .grp{display:grid; gap:var(--s16); align-content:start;}
  .grp > h2{margin:0; font-size:1rem; line-height:1.5rem; font-weight:700; padding:0;}
  .cards{display:grid; gap:var(--s16); grid-template-columns:1fr;}
  .card{background:var(--raised); border:0; border-radius:var(--r-surface); padding:var(--s8) var(--s20) var(--s20); display:grid; gap:var(--s8); align-content:start; min-width:0;}
  .card.is-have{background:var(--fill);}
  .card.is-nfu .thumb, .card.is-nfu .name{opacity:.62;}
  .qrow{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s8); flex-wrap:wrap;}
  .qty{display:grid; gap:var(--s4);}
  .stepper{display:inline-grid; grid-template-columns:44px 56px 44px; border:1.5px solid var(--control); border-radius:var(--r-pill); overflow:hidden;}
  .stepper button{height:44px; border:0; background:var(--raised); color:inherit; font-size:1.25rem; line-height:1.5rem; cursor:pointer;}
  .stepper button:disabled{color:var(--off); cursor:default;}
  .qty-in{height:44px; width:100%; text-align:center; border:0; border-inline:1.5px solid var(--control); background:var(--raised); color:inherit; font-size:1rem; line-height:1.5rem; font-weight:700; -moz-appearance:textfield;}
  .qty-in::-webkit-inner-spin-button, .qty-in::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  .brk{padding-top:var(--s4);}
  .readout{font-weight:600;}
  .mark{display:grid; grid-template-columns:1fr 1fr; border:1.5px solid var(--control); border-radius:var(--r-pill); overflow:hidden; margin-top:var(--s4);}
  .mark button{height:44px; border:0; background:var(--raised); color:inherit; font-size:.875rem; line-height:1.25rem; font-weight:600; cursor:pointer;}
  .mark button + button{border-left:1.5px solid var(--control);}
  .mark button[aria-pressed="true"]{background:var(--sel); color:var(--on-sel);}
  .mark button[aria-pressed="true"]::before{content:"\2713\00a0";}
  .stepper button:focus-visible, .stepper .qty-in:focus-visible, .mark button:focus-visible{outline-offset:-4px;}
  .skip{position:absolute; left:-9999px; top:var(--s8); z-index:20; min-height:44px; padding:0 var(--s16); border:1.5px solid var(--w-ink); border-radius:var(--r-pill); background:var(--w-ink); color:var(--paper); font:600 .875rem/1.25rem var(--font-body); cursor:pointer;}
  .skip:focus{left:var(--s8);}

  .box{background:var(--raised); border:0; border-radius:var(--r-field); padding:var(--s16) var(--s20);}
  .ftr{display:grid; gap:var(--s8); padding:var(--s32) var(--edge) var(--s48); background:var(--forest); color:var(--on-forest-soft); font-size:.875rem; line-height:1.25rem;}
  .ftr .flogo{font-family:var(--font-display); font-weight:600; font-size:1.375rem; line-height:1.75rem; color:var(--on-forest);}
  .ftr .flogo .dot{color:var(--clay);}
  .ftr .flink:focus-visible{outline-color:var(--on-forest);}

  dialog{border:1.5px solid var(--stroke); border-radius:var(--r-dialog); background:var(--raised); color:var(--w-ink); padding:var(--s24); width:min(92vw, 360px); font-family:var(--font-body); font-size:1rem; line-height:1.5rem;}
  dialog::backdrop{background:rgba(0,0,0,.5);}
  /* Inventory item panel: right side on desktop, bottom sheet on phones */
  .ipanel{position:fixed; inset:0 0 0 auto; margin:0; width:min(480px, 100vw); max-width:none; height:100dvh; max-height:none; padding:0; border:0; border-radius:var(--r-dialog) 0 0 var(--r-dialog); background:var(--raised); color:var(--w-ink); box-shadow:-12px 0 40px rgba(42,36,32,.18); overflow:auto; font-family:var(--font-body);}
  .ipanel::backdrop{background:rgba(42,36,32,.32);}
  .ipanel.is-phone{inset:auto 0 0 0; width:100vw; height:92dvh; border-radius:var(--r-dialog) var(--r-dialog) 0 0; box-shadow:0 -12px 40px rgba(42,36,32,.2);}
  .ip-inner{min-height:100%;}
  .ip{position:relative; display:grid; gap:var(--s16); padding:var(--s24) var(--s24) var(--s32);}
  .ip .ph-big{aspect-ratio:4/3;}
  .ip-x{position:absolute; top:var(--s12); right:var(--s12); z-index:1; width:44px; height:44px; border:0; border-radius:var(--r-pill); background:color-mix(in srgb, var(--raised) 88%, transparent); color:inherit; font-size:1.1rem; cursor:pointer;}
  .ip-head{display:grid; gap:var(--s8);}
  .ip-title{margin:0; font-family:var(--font-display); font-weight:400; font-size:1.75rem; line-height:2rem;}
  .ip .dtext{gap:var(--s12);}
  .card.is-panel{box-shadow:0 0 0 2px var(--w-ink);}
  .card-head .chev{font-size:1.1rem;}
  dialog .stack{display:grid; gap:var(--s12);}
  dialog h2{margin:0; font-size:1rem; line-height:1.5rem; font-weight:700;}
  dialog button, dialog input{font-family:inherit;}

  /* home */
  .home{gap:var(--s64); padding-top:var(--s40); padding-bottom:var(--s64);}
  .hero-grid{display:grid; gap:var(--s24); align-items:center;}
  .hero-copy{display:grid; gap:var(--s24); align-content:center;}
  .lead2{text-wrap:pretty; margin:0; font-size:1rem; line-height:1.5rem; color:var(--w-soft); max-width:46ch;}
  .hero-img{aspect-ratio:4/3; width:100%; background-color:var(--apricot); border-color:transparent;}
  .hl{color:var(--clay);}
  /* ---- variant B: lighter, larger serif; warm brown text; story headings; illustration instead of a box ---- */
  .vb{--w-ink:#3D2F28; --w-soft:#5A453B;}
  .vb .h1, .vb .sec-h, .vb .band-h, .vb .era-h{font-weight:360; font-variation-settings:'SOFT' 50; letter-spacing:-0.02em;}
  .vb .h1.display{font-size:3rem; line-height:3.25rem;}
  .vb .sec-h.story{font-size:2rem; line-height:2.375rem;}
  .vb .story-sub{margin:0; max-width:56ch; color:var(--w-soft); font-size:1.125rem; line-height:1.75rem;}
  .vb .hero-art{width:100%; height:auto;}
  .vb .img.tint{background:var(--apricot-100); background-image:none; border-color:transparent;}
  .vb .closer{text-align:center; padding-block:var(--s24); justify-items:center;}
  .vb .closer-art{width:min(280px, 70%); height:auto;}
  .ph{display:block; overflow:hidden; border-radius:var(--r-surface); background:var(--apricot-100);}
  .ph img{display:block; width:100%; height:100%; object-fit:cover;}
  .ph-card{aspect-ratio:4/3; border-radius:var(--r-inner);}
  .ph-thumb{width:48px; height:48px; flex:none; border-radius:var(--r-inner); transition:width .28s ease, margin .28s ease, opacity .18s ease;}
  /* when an item is open its picture is shown large below, so the thumbnail steps aside (header height stays the same) */
  .item.is-open:not(.is-closing) .ph-thumb, .card.is-open:not(.is-closing) .ph-thumb{width:0; margin-right:calc(-1 * var(--s12)); opacity:0;}
  .is-closing .ph-thumb{opacity:0; transition:width .22s ease, margin .22s ease;}   /* slot reopens while the big picture flies back into it */
  @media (prefers-reduced-motion: reduce){ .ph-thumb{transition:none;} }
  .ph-big{aspect-ratio:4/3; width:100%; border-radius:var(--r-inner);}
  .era{display:grid; gap:var(--s16); align-items:center; border-radius:var(--r-surface); padding:var(--s24); margin:var(--s24) 0 0;}

      '<p class="sub">Week by week: what is usually on for you, and what is happening with your baby.</p></div>' +
      '<p class="notice">' + esc(TLW.intro || 'Typical timing only, not medical advice. Your doctor or midwife sets your actual dates.') + '</p>' +
      '<div class="opt datebox"><label for="tl-due" class="cap">Due date</label><div class="daterow"><input id="tl-due" class="field" type="date" value="' + esc(S.due) + '">' +
      (S.due ? '<button type="button" class="linkbtn" data-action="tl-clear">Clear</button>' : '') + '</div>' +
      '<p class="sm">Optional. It adds dates to each week and marks this week. In this prototype it is saved on this device only.</p><p class="sm" id="due-note" aria-live="polite">' + dueNote(due, now) + '</p></div>' +
      '<div class="controls tlctl"><div class="chips" role="group" aria-label="Show">' + cats + '</div>' + '</div>' +
      '<div id="tlbody">' + weeksBody(now, due) + '</div></section>';
    scrollToWeek(now, false);
  }

  function focusSel(sel, alt){ var el = $(sel); if (el && !el.disabled) { el.focus(); return; } var a = alt && $(alt); if (a && !a.disabled) a.focus(); }

  function render(focusHeading){
    renderHeader();
    if (U.route === 'home') renderHome(); else if (U.route === 'inventory') renderInventory(); else if (U.route === 'timeline') renderTimeline(); else if (U.route === 'verdicts') renderVerdicts(); else renderDictionary();
    if (focusHeading) { var h = $('#view .h1'); if (h) h.focus({preventScroll:true}); }
  }

  // ---------- actions ----------
  function rememberOpener(){
    var el = document.activeElement, art = el && el.closest ? el.closest('[data-slug]') : null;
    U.opener = {el:el, slug:art ? art.dataset.slug : null, action:el && el.dataset ? el.dataset.action : null};
  }
  function restoreFocus(afterSignIn){
    var o = U.opener; U.opener = null; if (!o) return;
    if (afterSignIn && o.action === 'signin-open') { focusSel('[data-action="acct"]'); return; }
    if (o.el && document.contains(o.el) && !o.el.disabled) { o.el.focus(); return; }
    if (o.slug && o.action) focusSel('#ilist [data-slug="' + o.slug + '"] [data-action="' + o.action + '"]', '#ilist [data-slug="' + o.slug + '"] [data-action="inc"]');
  }
  function requireAuth(fn, onCancel){
    if (S.signedIn) { fn(); return; }
    U.pending = {fn:fn, onCancel:onCancel}; rememberOpener(); $('#sheet').showModal();
  }

  function changeQty(slug, delta, absolute, focusSel){
    var it = BY[slug], cur = getQ(it, S.age);
    var next = absolute != null ? absolute : cur + delta;
    if (isNaN(next)) next = 0;
    next = Math.max(0, Math.min(99, next));
    if (next === cur) { refreshCard(slug, focusSel); return; }
    requireAuth(function(){
      setQ(it, S.age, next); U.pinned[slug] = true; refreshCard(slug, focusSel); renderSummary();
    }, function(){ refreshCard(slug); });
  }

  // Inventory cards sit in a grid and an open card spans the full row, so opening or closing one moves its
  // neighbours. Record where every card is, apply the change, then slide each card from its old spot (FLIP).
  function flipCards(root, change){
    var cards = [].slice.call(root.querySelectorAll('article.card')), before = cards.map(function(c){ return c.getBoundingClientRect(); });
    var result = change();
    if (!REDUCE) cards.forEach(function(c, i){
      var a = before[i], b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if ((Math.abs(dx) > 1 || Math.abs(dy) > 1) && c.animate) c.animate([{transform:'translate(' + dx + 'px,' + dy + 'px)'}, {transform:'none'}], {duration:240, easing:'cubic-bezier(.2,.75,.2,1)'});
    });
    return result;
  }

  // ---------- Inventory: item details in a side panel (bottom sheet on phones); the grid never moves ----------
  function isPhone(){ return window.innerWidth < 640; }
  function panelHTML(it){
    return '<div class="ip" data-slug="' + it.slug + '">' +
      '<button type="button" class="ip-x" data-action="ip-close" aria-label="Close details">✕</button>' +
      itemPhoto(it, 'big') +
      '<div class="ip-head"><h2 id="ipanel-title" class="ip-title">' + esc(it.name) + '</h2>' + chip(it) + '</div>' +
      '<div class="ip-ctl">' + controlsHTML(it) + '</div>' +
      detailText(it, it.aliases && it.aliases.length ? '<p class="sm">Also called ' + esc(it.aliases.join(', ')) + '</p>' : '',
        (it.advised && it.safety) ? '<p class="safety"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L19 6 L19 11 Q19 17.5 12 21 Q5 17.5 5 11 L5 6 Z"/></svg><span>' + esc(it.safety) + '</span></p>' : '') +
      '</div>';
  }
  function cardThumb(slug){ return $('#ilist [data-slug="' + slug + '"] .ph-thumb'); }
  function openPanel(slug, btn){
    var dlg = $('#ipanel'); if (dlg.open || dlg.dataset.anim) return;
    var thumb = btn.querySelector('.ph-thumb'), from = thumb ? thumb.getBoundingClientRect() : null;
    U.panelSlug = slug; U.panelOpener = btn;
    $('#ipanel-body').innerHTML = panelHTML(BY[slug]);
    dlg.classList.toggle('is-phone', isPhone());
    dlg.showModal();
    btn.setAttribute('aria-expanded', 'true'); btn.closest('article').classList.add('is-panel');
    var big = dlg.querySelector('.ph-big');
    if (REDUCE || !dlg.animate) { if (thumb) thumb.style.visibility = 'hidden'; return; }
    // the panel slides in; the picture starts on the thumbnail (allowing for the panel's own starting offset)
    var phone = isPhone(), D = 260, EASE = 'cubic-bezier(.2,.75,.2,1)';
    var to = big ? big.getBoundingClientRect() : null;
    var offX = phone ? 0 : 32, offY = phone ? dlg.offsetHeight : 0;
    dlg.animate([{transform:'translate(' + offX + 'px,' + offY + 'px)', opacity:phone ? 1 : 0}, {transform:'none', opacity:1}], {duration:D, easing:EASE});
    if (from && to && big) {
      if (thumb) thumb.style.visibility = 'hidden';
      big.animate([
        {transformOrigin:'0 0', transform:'translate(' + (from.left - to.left - offX) + 'px,' + (from.top - to.top - offY) + 'px) scale(' + (from.width / to.width) + ',' + (from.height / to.height) + ')'},
        {transformOrigin:'0 0', transform:'none'}
      ], {duration:D, easing:EASE});
    }
    var rest = dlg.querySelectorAll('.ip-head, .ip-ctl, .dtext');
    [].forEach.call(rest, function(el){ el.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}], {duration:200, delay:90, easing:'ease-out', fill:'backwards'}); });
  }
  function closePanel(){
    var dlg = $('#ipanel'); if (!dlg.open || dlg.dataset.anim) return;
    var slug = U.panelSlug, thumb = cardThumb(slug), big = dlg.querySelector('.ph-big');
    var finish = function(){
      if (!dlg.open) return;
      if (dlg.getAnimations) dlg.getAnimations({subtree:true}).forEach(function(an){ an.cancel(); });
      dlg.close(); delete dlg.dataset.anim; $('#ipanel-body').innerHTML = '';
      U.panelSlug = null;
      var t = cardThumb(slug); if (t) t.style.visibility = '';
      var card = $('#ilist [data-slug="' + slug + '"]');
      if (card) { card.classList.remove('is-panel'); var b = card.querySelector('[data-action="toggle"]'); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); } }
      U.panelOpener = null;
    };
    if (REDUCE || !dlg.animate) { finish(); return; }
    dlg.dataset.anim = '1';
    var phone = isPhone(), D = 220, EASE = 'cubic-bezier(.4,0,.2,1)';
    var offX = phone ? 0 : 32, offY = phone ? dlg.offsetHeight : 0;
    [].forEach.call(dlg.querySelectorAll('.ip-head, .ip-ctl, .dtext, .ip-x'), function(el){ el.animate([{opacity:1}, {opacity:0}], {duration:110, fill:'forwards'}); });
    dlg.animate([{transform:'none', opacity:1}, {transform:'translate(' + offX + 'px,' + offY + 'px)', opacity:phone ? 1 : 0}], {duration:D, easing:EASE, fill:'forwards'});
    if (big && thumb) {
      var from = big.getBoundingClientRect(), to = thumb.getBoundingClientRect();
      // the picture shrinks back onto the card's thumbnail while the panel slides away (so allow for that end offset)
      big.animate([
        {transformOrigin:'0 0', transform:'none'},
        {transformOrigin:'0 0', transform:'translate(' + (to.left - from.left - offX) + 'px,' + (to.top - from.top - offY) + 'px) scale(' + (to.width / from.width) + ',' + (to.height / from.height) + ')'}
      ], {duration:D, easing:EASE, fill:'forwards'}).onfinish = finish;
    }
    setTimeout(finish, D + 150);   // never leave the panel half-closed if the animation doesn't run (hidden tab)
  }

  function toggleDetail(btn){
    var art = btn.closest('article'), slug = art.dataset.slug, ctx = art.classList.contains('card') ? 'inv' : 'dict';
    if (ctx === 'inv') { openPanel(slug, btn); return; }
    var open = btn.getAttribute('aria-expanded') === 'true';
    var root = art.closest(ctx === 'inv' ? '#ilist' : '#dlist');
    if (!open) {
      root.querySelectorAll('[data-action="toggle"][aria-expanded="true"]').forEach(function(b){
        var a = b.closest('article'); b.setAttribute('aria-expanded', 'false'); a.classList.remove('is-open');
        var d = a.querySelector('.detail');
        if (d.getAnimations) d.getAnimations({subtree:true}).forEach(function(an){ an.cancel(); });
        d.hidden = true; d.innerHTML = ''; a.classList.remove('is-closing'); delete a.dataset.anim;
      });
    }
    var det = art.querySelector('.detail'), thumb = art.querySelector('.ph-thumb');
    if (art.dataset.anim) return;
    if (open) {
      btn.setAttribute('aria-expanded', 'false'); U.open[ctx] = null;
      var finishClose = function(){
        if (!art.classList.contains('is-open') || btn.getAttribute('aria-expanded') === 'true') { delete art.dataset.anim; return; }
        var collapse = function(){
          if (det.getAnimations) det.getAnimations({subtree:true}).forEach(function(an){ an.cancel(); });
          det.hidden = true; det.innerHTML = '';
          if (thumb) thumb.style.transition = 'none';
          art.classList.remove('is-open', 'is-closing');
          if (thumb) { void thumb.offsetWidth; thumb.style.transition = ''; }
        };
        if (ctx === 'inv') flipCards(root, collapse); else collapse();
        delete art.dataset.anim;
      };
      var bigC = det.querySelector('.ph-big');
      if (!bigC || !thumb || REDUCE || !bigC.animate) { finishClose(); return; }
      art.dataset.anim = '1';
      // 1) the thumbnail's slot opens again (name slides back), still invisible
      var fromC = bigC.getBoundingClientRect(), size = thumb.offsetHeight;
      art.classList.add('is-closing');
      var slot = thumb.getBoundingClientRect();   // its left/top don't move while its width grows back
      var D = 220, EASE = 'cubic-bezier(.4,0,.2,1)';
      // 2) the text fades and the panel's height closes at the same time, so nothing jumps at the end
      var txt = det.querySelector('.dtext'); if (txt) txt.animate([{opacity:1}, {opacity:0}], {duration:110, fill:'forwards'});
      var cs = getComputedStyle(det);
      det.animate([
        {height:det.offsetHeight + 'px', paddingBottom:cs.paddingBottom},
        {height:'0px', paddingBottom:'0px'}
      ], {duration:D, easing:EASE, fill:'forwards'});
      // 3) the big picture shrinks into the thumbnail's slot on this same card
      bigC.animate([
        {transformOrigin:'0 0', transform:'none'},
        {transformOrigin:'0 0', transform:'translate(' + (slot.left - fromC.left) + 'px,' + (slot.top - fromC.top) + 'px) scale(' + (size / fromC.width) + ',' + (size / fromC.height) + ')'}
      ], {duration:D, easing:EASE, fill:'forwards'}).onfinish = finishClose;
      setTimeout(finishClose, D + 150);   // never leave a card half-closed if the animation doesn't run (hidden tab)
      return;
    }
    // opening: the thumbnail grows into the big picture's place, then the thumbnail hides
    var from = thumb ? thumb.getBoundingClientRect() : null, to = null, cardBefore = art.getBoundingClientRect(), cardDx = 0, cardDy = 0;
    var expand = function(){
      det.innerHTML = detailHTML(BY[slug], ctx); det.hidden = false; U.open[ctx] = slug;
      btn.setAttribute('aria-expanded', 'true'); art.classList.add('is-open');
      var b = det.querySelector('.ph-big'); if (b) to = b.getBoundingClientRect();   // measured before any card starts sliding
      var cardAfter = art.getBoundingClientRect(); cardDx = cardBefore.left - cardAfter.left; cardDy = cardBefore.top - cardAfter.top;
    };
    if (ctx === 'inv') flipCards(root, expand); else expand();
    var big = det.querySelector('.ph-big');
    if (!from || !big || !to || REDUCE || !big.animate) return;
    big.animate([
      // the card itself may be sliding (Inventory grid), so start the picture relative to the card's moving frame
      {transformOrigin:'0 0', transform:'translate(' + (from.left - to.left - (ctx === 'inv' ? cardDx : 0)) + 'px,' + (from.top - to.top - (ctx === 'inv' ? cardDy : 0)) + 'px) scale(' + (from.width / to.width) + ',' + (from.height / to.height) + ')'},
      {transformOrigin:'0 0', transform:'none'}
    ], {duration:260, easing:'cubic-bezier(.2,.75,.2,1)'});
    var dtext = det.querySelector('.dtext');
    if (dtext) dtext.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}], {duration:200, delay:80, easing:'ease-out', fill:'backwards'});
  }

  (function(){
    var dlg = document.getElementById('ipanel');
    dlg.addEventListener('cancel', function(e){ e.preventDefault(); closePanel(); });              // Escape
    dlg.addEventListener('click', function(e){ if (e.target === dlg) closePanel(); });            // the dimmed page
  })();

  // ---------- routes (hash based, so Back, deep links and shared links work) ----------
  var TITLES = {home:'Plainly: Baby gear, explained plainly', dictionary:'Dictionary · Plainly', inventory:'Inventory · Plainly', timeline:'Timeline · Plainly', verdicts:'How verdicts work · Plainly'};
  function routeFromHash(){ var h = (location.hash || '').replace(/^#\/?/, ''); return ['dictionary', 'inventory', 'timeline', 'verdicts'].indexOf(h) >= 0 ? h : 'home'; }
  function show(route, focus){
    U.route = route; U.acct = false; U.pinned = {};
    try { document.title = TITLES[route]; } catch (e) {}
    render(focus);
    window.scrollTo(0, 0);
  }
  function go(route){
    if (routeFromHash() === route) { show(route, true); return; }
    try { location.hash = route === 'home' ? '#/' : '#/' + route; } catch (e) {}
    setTimeout(function(){ if (U.route !== route) show(route, true); }, 60);
  }
  window.addEventListener('hashchange', function(){ show(routeFromHash(), true); });

  // ---------- events ----------
  var proto = $('#proto');
  proto.addEventListener('click', function(e){
    var t = e.target.closest('[data-nav],[data-action],[data-dv],[data-iv],[data-age],[data-letter],[data-tlv],[data-tlc]');
    if (!t || !proto.contains(t)) return;
    if (t.dataset.nav) { go(t.dataset.nav); return; }
    if (t.dataset.dv) { U.dv = t.dataset.dv; U.open.dict = null; renderDictionary(); focusSel('[data-dv="' + t.dataset.dv + '"]'); return; }
    if (t.dataset.iv) { U.iv = t.dataset.iv; U.pinned = {}; U.open.inv = null; renderInventory(); focusSel('[data-iv="' + t.dataset.iv + '"]'); return; }
    if (t.dataset.age) { S.age = t.dataset.age; U.pinned = {}; save(); renderInventory(); focusSel('[data-age="' + t.dataset.age + '"]'); return; }
    if (t.dataset.letter) { var h = document.getElementById('L-' + t.dataset.letter); if (h) h.scrollIntoView({behavior: REDUCE ? 'auto' : 'smooth', block:'start'}); return; }
    if (t.dataset.tlv) { U.tlView = t.dataset.tlv; renderTimeline(); focusSel('[data-tlv="' + t.dataset.tlv + '"]'); return; }
    if (t.dataset.tlc) { U.tlCat = t.dataset.tlc; renderTimeline(); focusSel('[data-tlc="' + t.dataset.tlc + '"]'); return; }
    var a = t.dataset.action, art = t.closest('[data-slug]'), slug = art && art.dataset.slug;
    if (a === 'toggle') toggleDetail(t);
    else if (a === 'inc') changeQty(slug, 1, null, '[data-action="inc"]');
    else if (a === 'dec') changeQty(slug, -1, null, '[data-action="dec"]');
    else if (a === 'markhave') requireAuth(function(){
      var it = BY[slug]; setQ(it, 'all', have(it) ? 0 : 1); U.pinned[slug] = true;
      refreshCard(slug, '[data-action="markhave"]'); renderSummary();
    }, function(){});
    else if (a === 'nfu') requireAuth(function(){
      if (S.nfu[slug]) delete S.nfu[slug]; else { S.nfu[slug] = true; delete S.qty[slug]; }
      U.pinned[slug] = true; save(); refreshCard(slug, '[data-action="nfu"]'); renderSummary();
    }, function(){});
    else if (a === 'tl-open') {
      var id = t.dataset.id, body = t.nextElementSibling, opening = t.getAttribute('aria-expanded') !== 'true';
      body.hidden = !opening; t.setAttribute('aria-expanded', opening ? 'true' : 'false'); t.textContent = opening ? 'Hide details' : 'See details'; t.setAttribute('aria-label', (opening ? 'Hide details: ' : 'See details: ') + (t.dataset.title || ''));
      U.tlOpen = opening ? id : null;
    }
    else if (a === 'tl-page') { U.tlPage = (U.tlPage || 0) + parseInt(t.dataset.dir, 10); renderTimeline(); focusSel('[data-action="tl-page"][data-dir="' + t.dataset.dir + '"]', '[data-action="tl-page"][data-dir="' + (-parseInt(t.dataset.dir, 10)) + '"]'); }
    else if (a === 'tl-step') {
      var cw = fromKey(U.tlWeek) || currentWeek() || {era:'preg', n:20}, ni = Math.max(0, Math.min(WEEKS.length - 1, wkIndex(cw) + parseInt(t.dataset.dir, 10)));
      U.tlWeek = wkKey(WEEKS[ni]); renderTimeline(); focusSel('[data-action="tl-step"][data-dir="' + t.dataset.dir + '"]', '[data-action="tl-step"][data-dir="' + (-parseInt(t.dataset.dir, 10)) + '"]');
    }
    else if (a === 'tl-now') { var nw = currentWeek(), wc = nw && document.getElementById('wk-' + wkKey(nw)); if (wc) { scrollToWeek(nw, true); wc.setAttribute('tabindex', '-1'); wc.focus({preventScroll:true}); } }
    else if (a === 'tl-scroll') scrollTrack(parseInt(t.dataset.dir, 10));
    else if (a === 'tl-bar') {
      U.tlBar = U.tlBar === t.dataset.id ? null : t.dataset.id;
      [].forEach.call(document.querySelectorAll('.bar'), function(b){ b.setAttribute('aria-expanded', b.dataset.id === U.tlBar ? 'true' : 'false'); });
      var dt = $('#tl-detail'); dt.innerHTML = barDetail(); dt.hidden = !U.tlBar;
      if (U.tlBar) { dt.scrollIntoView({behavior: REDUCE ? 'auto' : 'smooth', block:'nearest'}); }
    }
    else if (a === 'tl-bar-close') { var was = U.tlBar; U.tlBar = null; $('#tl-detail').hidden = true; $('#tl-detail').innerHTML = ''; var bb = document.querySelector('.bar[data-id="' + was + '"]'); if (bb) { bb.setAttribute('aria-expanded', 'false'); bb.focus(); } }
    else if (a === 'tl-clear') { S.due = ''; U.tlWeek = null; U.tlPage = null; save(); renderTimeline(); focusSel('#tl-due'); }
    else if (a === 'tl-gear') { U.iv = 'left'; U.open.inv = null; go('inventory'); }
    else if (a === 'ip-close') closePanel();
    else if (a === 'signin-open') { U.pending = {fn:function(){}, onCancel:null}; rememberOpener(); $('#sheet').showModal(); }
    else if (a === 'signout') { S.signedIn = false; U.acct = false; save(); render(false); focusSel('[data-action="signin-open"]'); }
    else if (a === 'acct') { U.acct = !U.acct; renderHeader(); focusSel('[data-action="acct"]'); }
    else if (a === 'skip') { var sh = $('#view .h1'); if (sh) sh.focus(); }
  });

  proto.addEventListener('change', function(e){
    if (e.target.id === 'tl-due') {
      var dv = e.target.value || '';
      if (dv && !validDue(dv)) return;   // half-typed or out-of-range date: wait, and say so on blur
      S.due = dv; U.tlPage = null; U.tlWeek = null; save(); refreshTimelineBody(); return;
    }
    if (e.target.id === 'tl-week') { U.tlWeek = e.target.value; renderTimeline(); focusSel('#tl-week'); return; }
    if (e.target.classList.contains('qty-in')) {
      var art = e.target.closest('[data-slug]');
      changeQty(art.dataset.slug, 0, parseInt(e.target.value, 10), '.qty-in');
    }
  });
  proto.addEventListener('focusout', function(e){
    if (e.target.id !== 'tl-due') return;
    var v = e.target.value || '', note = $('#due-note'); if (!note) return;
    note.textContent = (v && !validDue(v)) ? 'That date looks off. Enter a due date from about six months ago to nine months from now.' : dueNote(dueDate(), currentWeek());
  });
  proto.addEventListener('input', function(e){
    if (e.target.id === 'dq') { U.dq = e.target.value; U.open.dict = null; renderDictList(); }
    else if (e.target.id === 'iq') { U.iq = e.target.value; U.pinned = {}; U.open.inv = null; renderInvList(); }
  });

  var sheet = $('#sheet');
  sheet.addEventListener('click', function(e){
    var b = e.target.closest('[data-sheet]'); if (!b) return;
    var p = U.pending; U.pending = null;
    if (b.dataset.sheet === 'signin') {
      S.signedIn = true; save(); sheet.close(); renderHeader(); if (p && p.fn) p.fn(); restoreFocus(true);
    } else { sheet.close(); if (p && p.onCancel) p.onCancel(); restoreFocus(false); }
  });
  sheet.addEventListener('close', function(){
    if (U.pending) { var p = U.pending; U.pending = null; if (p.onCancel) p.onCancel(); restoreFocus(false); }
  });

  if (window.ResizeObserver) {
    var lastWide = proto.clientWidth >= 900;
    new ResizeObserver(function(){ var w = proto.clientWidth >= 900; if (w !== lastWide) { lastWide = w; if (U.route === 'timeline') refreshTimelineBody(); } }).observe(proto);
  }
  document.title = TITLES[U.route];
  try { render(false); } catch (err) { try { localStorage.removeItem(KEY); } catch (e2) {} S = defaults(); render(false); }
})();
</script>
